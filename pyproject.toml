[project]
name = "smt-switch"
description = "Python bindings for the smt-switch C++ SMT solving library"
readme = { file = "python/README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Yoni Zohar", email = "yoni.zohar@biu.ac.il" },
  { name = "Áron Ricardo Perez-Lopez", email = "arpl@cs.stanford.edu" },
  { name = "Makai Mann", email = "makaim@cs.stanford.edu" },
  { name = "Clark Barrett", email = "barrett@cs.stanford.edu" },
]
keywords = [
  "SMT",
  "SMT-LIB",
  "formal-methods",
  "formal-verification",
  "satisfiability",
  "solver",
  "theorem-prover",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/stanford-centaur/smt-switch"
Issues = "https://github.com/stanford-centaur/smt-switch/issues"
Repository = "https://github.com/stanford-centaur/smt-switch.git"

[project.optional-dependencies]
pysmt = ["pysmt"]
test = ["pytest"]

[build-system]
requires = ["Cython>=3.0.0", "scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

# The version, read from the VERSION file by scikit-build-core
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '(?m)^(?P<value>\d+\.\d+\.\d+)$'

# CMake builds and installs the package; this only says how to call it.
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
# CMake installs everything that goes in the package, as its python
# component; the rest of what it installs is for C++ users.
wheel.packages = []
install.components = ["python"]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
BUILD_TESTS = "OFF"
# The solvers the published wheels bundle, which cibw-build-deps.sh provisions
BUILD_BITWUZLA = "ON"
BUILD_CVC5 = "ON"
BUILD_Z3 = "ON"
