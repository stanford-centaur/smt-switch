version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      pre-commit:
        patterns:
          - "*"
  # ci-scripts/requirements.txt, which the CI workflow installs from
  - package-ecosystem: "pip"
    directory: "/ci-scripts"
    schedule:
      interval: "daily"
    groups:
      pip:
        patterns:
          - "*"
