on: [push, workflow_dispatch]
name: CI
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
        solver:
          - bitwuzla
          - btor
          - cvc5
          - msat
          - yices2
          - z3
    name: ${{ matrix.solver }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      # The install-packages scripts are named after the label's first element
      RUNNER_LABEL: ${{ matrix.runner }}
      # Read by the MathSAT step below and by compute-solver-hash.sh
      MSAT_VERSION: 5.6.18
      # Names the artifact; a fold here would put a space in it
      BUILD_ID: ${{ matrix.runner }}-${{ matrix.solver }}
    steps:
      - name: Check out project source
        uses: actions/checkout@v7
      - name: Install packages
        run: ./ci-scripts/install-packages-"${RUNNER_LABEL%%-*}".sh
      - name: Compute the cache key for the solver build
        id: compute-solver-hash
        run: ./ci-scripts/compute-solver-hash.sh ${{ matrix.solver }}
      - name: Restore solver build from cache
        uses: actions/cache/restore@v6
        id: cache
        with:
          path: deps
          key: deps-${{ steps.compute-solver-hash.outputs.result }}
      # Every other solver is provisioned by the Configure step below. MathSAT
      # cannot be: its licence does not let the build download it on a user's
      # behalf. Running this workflow accepts that licence.
      - name: Set up MathSAT
        if: matrix.solver == 'msat' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          MSAT_PLATFORM: >-
            ${{ runner.os == 'macOS' && 'macos' || 'linux-x86_64' }}
        run: |
          archive=mathsat-$MSAT_VERSION-$MSAT_PLATFORM.tar.gz
          mkdir -p deps/mathsat
          curl -fLsS "https://mathsat.fbk.eu/release/$archive" |
            tar -xz -C deps/mathsat --strip-components 1
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv --system-site-packages
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure
        env:
          OPT: --${{ matrix.solver }}
          # Both configurations from one configure; each is built below
          CMAKE_GENERATOR: Ninja Multi-Config
        run: ./configure.sh --static --python --smtlib-reader --allow-gpl "$OPT"
      # After Configure, as that is what builds the solver.
      - name: Save solver build to cache
        uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: deps
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build
        working-directory: build
        run: cmake --build . --config Debug && cmake --build . --config Release
      - name: Test C++
        id: test-cpp
        continue-on-error: true
        working-directory: build
        env:
          # Lets the precompiled MathSAT binary find libgmp
          DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
        run: ctest -C Debug && ctest -C Release
      - name: Upload failing test log
        if: steps.test-cpp.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ env.BUILD_ID }}
          path: build/Testing/Temporary/LastTest.log
      - name: Fail pipeline due to C++ test failure
        if: steps.test-cpp.outcome == 'failure'
        run: |
          echo "C++ tests failed. Inspect the artifact for details."
          exit 1
      - name: Test Python bindings
        run: |
          pip install "$(ls build/python/Release/*.whl)[pysmt,test]"
          pytest tests/python
          pip install --force-reinstall --no-deps build/python/Debug/*.whl
          pytest tests/python
