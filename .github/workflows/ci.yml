on:
  merge_group:
  push:
    branches-ignore: [gh-readonly-queue/**]
  workflow_dispatch:
name: CI
# Superseded runs are pointless on branches, but main needs a run per commit:
# giving each of its commits its own group keeps them from queueing, where a
# pending run is cancelled as soon as the next one arrives.
concurrency:
  group: ci-${{ github.ref_name == 'main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  # Skips all checks in the merge queue if they already passed on the PR.
  queue:
    name: Check for an earlier test
    runs-on: ubuntu-slim
    permissions:
      checks: read # to look up the pull request's result
      contents: read
      pull-requests: read # to look up its head commit
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Check out project source
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v7
      - name: Compare with the pull request's head
        id: check
        if: github.event_name == 'merge_group'
        env:
          CHECK_NAME: &passed-check CI passed
          GH_TOKEN: ${{ github.token }}
        run: ci-scripts/check-queue-tested.sh
  # Outputs the list of solvers that we can test here and marks the ones that
  # have builds missing from the cache.
  plan:
    needs: queue
    if: needs.queue.outputs.tested != 'true'
    strategy:
      matrix:
        # Hack: not a real matrix, as its one value spawns a single job. It
        # exists only to name this list, which the base and full matrices
        # reuse through the anchor, as strategy cannot read env.
        runners:
          - &runners
            - ubuntu-24.04
            - macos-26
    name: Plan solver builds
    runs-on: ubuntu-slim
    permissions:
      actions: read # to look up cache entries
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      entries: ${{ steps.plan.outputs.entries }}
    steps:
      - name: Check out project source
        uses: actions/checkout@v7
      - name: Look up the cached solver builds
        id: plan
        env:
          SOLVERS: |
            bitwuzla
            boolector
            cvc5
            mathsat
            yices2
            z3
          RUNNERS: ${{ join(matrix.runners, ' ') }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: ci-scripts/plan-deps.sh
  # Builds each solver requested by the plan job and saves it in the cache.
  deps:
    needs: plan
    if: needs.plan.outputs.build != '[]'
    strategy:
      # Whatever did build is still worth saving for the next run
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    name: Build solver
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Look up the cache entry
        id: lookup
        env:
          ENTRIES: ${{ needs.plan.outputs.entries }}
          RUNNER: ${{ matrix.runner }}
          SOLVER: ${{ matrix.solver }}
        run: |
          entry=$(
            jq -ce --arg runner "$RUNNER" --arg solver "$SOLVER" \
              '.[$runner][] | select(.solver == $solver)' <<<"$ENTRIES"
          )
          echo "entry=$entry" >>"$GITHUB_OUTPUT"
      - name: Check out project source
        uses: actions/checkout@v7
      - &install-packages
        name: Install packages
        id: install-packages
        env:
          RUNNER: ${{ matrix.runner }}
        working-directory: ci-scripts
        run: |
          source vars.sh
          if [[ $RUNNER_OS == Linux ]]; then
            read -r -a packages <<<"$APT_PACKAGES"
            sudo apt-get update
            sudo apt-get install --no-install-recommends "${packages[@]}"
          else
            read -r -a packages <<<"$BREW_PACKAGES"
            brew install "${packages[@]}"
          fi
          extra_libs_script=install-extra-libraries-${RUNNER%%-*}.sh
          hash=$(cat "$extra_libs_script" vars.sh | shasum -a 256 | cut -c 1-64)
          echo "extra-libs-key=extra-libraries-$RUNNER-$hash" >>"$GITHUB_OUTPUT"
          echo "extra-libs-dir=$EXTRA_LIBRARIES_DIR" >>"$GITHUB_OUTPUT"
      - &restore-extra-libraries
        name: Restore the extra libraries
        id: restore-extra-libraries
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.install-packages.outputs.extra-libs-dir }}
          key: ${{ steps.install-packages.outputs.extra-libs-key }}
      - &install-extra-libraries
        name: Install extra libraries
        env:
          RUNNER: ${{ matrix.runner }}
        working-directory: ci-scripts
        run: ./install-extra-libraries-"${RUNNER%%-*}".sh
      - &save-extra-libraries
        name: Save the extra libraries to the cache
        if: steps.restore-extra-libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.install-packages.outputs.extra-libs-dir }}
          key: ${{ steps.install-packages.outputs.extra-libs-key }}
      - &python-setup
        name: Set up Python virtual environment
        run: |
          python3 -m venv .venv --system-site-packages
          .venv/bin/pip install --require-hashes -r ci-scripts/requirements.txt
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
      # Every other solver is provisioned by the Configure step below
      - name: Download MathSAT
        if: matrix.solver == 'mathsat'
        env:
          DIR: ${{ fromJSON(steps.lookup.outputs.entry).path }}
        run: ci-scripts/download-mathsat.sh "$DIR"
      - name: Configure smt-switch and build solver
        if: matrix.solver != 'mathsat'
        env:
          CMAKE_GENERATOR: Ninja
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          SOLVER: ${{ matrix.solver }}
        run: ./configure.sh --allow-gpl "--$SOLVER"
      - name: Save the solver build to the cache
        uses: actions/cache/save@v6
        with:
          path: ${{ fromJSON(steps.lookup.outputs.entry).path }}
          key: ${{ fromJSON(steps.lookup.outputs.entry).key }}
  base:
    needs: queue
    if: needs.queue.outputs.tested != 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: *runners
    name: Test without solvers
    runs-on: ${{ matrix.runner }}
    env:
      # The solvers to restore and enable, as plan lists them for full
      DEPS_ENTRIES: "[]"
    steps: &build-steps
      - name: Check out project source
        uses: actions/checkout@v7
      - *install-packages
      - *restore-extra-libraries
      - *install-extra-libraries
      - *save-extra-libraries
      - name: Restore the solver builds
        if: env.DEPS_ENTRIES != '[]'
        uses: ./.github/actions/restore-deps
        with:
          entries: ${{ env.DEPS_ENTRIES }}
      - *python-setup
      - name: Configure
        env:
          CMAKE_GENERATOR: Ninja Multi-Config
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          flags=$(jq -r '.[] | "--" + .solver' <<<"$DEPS_ENTRIES")
          read -r -d '' -a flags < <(printf '%s\0' "$flags")
          ./configure.sh --static --python --smtlib-reader --no-auto-deps \
            --strict "${flags[@]}"
      - name: Build
        working-directory: build
        run: cmake --build . --config Debug && cmake --build . --config Release
      - name: Test C++
        id: test-cpp
        continue-on-error: true
        working-directory: build
        env:
          # msat-printing runs the MathSAT executable, which needs libgmp
          DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
        run: ctest -C Debug --parallel && ctest -C Release --parallel
      - name: Upload failing test log
        if: steps.test-cpp.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.runner }}-${{ github.job }}
          path: build/Testing/Temporary/LastTest.log
      - name: Fail pipeline due to C++ test failure
        if: steps.test-cpp.outcome == 'failure'
        run: |
          echo "C++ tests failed. Inspect the artifact for details."
          exit 1
      - name: Test Python bindings
        run: |
          pip install "$(ls build/python/Release/*.whl)[pysmt,test]"
          pytest tests/python
          pip install --force-reinstall --no-deps build/python/Debug/*.whl
          pytest tests/python
  full:
    needs: [plan, deps]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.deps.result)
    strategy:
      fail-fast: false
      matrix:
        runner: *runners
    name: Test with all solvers
    runs-on: ${{ matrix.runner }}
    env:
      DEPS_ENTRIES: >-
        ${{ toJSON(fromJSON(needs.plan.outputs.entries)[matrix.runner]) }}
    steps: *build-steps
  # Names of matrix jobs are different when skipped (no runner name), so they
  # cannot be added to the list of required checks. This one is used instead.
  passed:
    needs: [queue, base, full]
    if: ${{ !cancelled() }}
    name: *passed-check
    runs-on: ubuntu-slim
    steps:
      - name: Check the test results
        env:
          TESTED: ${{ needs.queue.outputs.tested }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if [[ $TESTED == true ]]; then
            echo "The queued pull request already passed with this tree."
          else
            jq -e 'all(. == "success")' <<<"$RESULTS"
          fi
