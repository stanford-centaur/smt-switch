name: Build and Upload Wheels
on:
  release:
    types: [published]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      deploy_target:
        type: choice
        description: "Choose the deployment target"
        options:
          - None
          - PyPI
          - Test PyPI
jobs:
  build_wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        name: [manylinux-x86_64, manylinux-aarch64, macos-x86_64, macos-arm64]
        include:
          - name: manylinux-x86_64
            runner: ubuntu-latest
            arch: x86_64
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            shell: bash
          - name: macos-x86_64
            runner: macos-15-intel
            macos-target: 15
          - name: macos-arm64
            runner: macos-15
            macos-target: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # cibuildwheel needs pyproject.toml present from the start
      - name: Place pyproject.toml
        run: mkdir -p build/python && cp python/pyproject.toml build/python
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          # Where the setup.py and pyproject.toml build infrastructure is
          package-dir: build/python
        env:
          # Every released CPython that is not yet end-of-life
          # Keep in sync with requires-python in python/pyproject.toml
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
          CIBW_BEFORE_ALL_LINUX: |
            ci-scripts/cibw-install-linux.sh && ci-scripts/cibw-build-deps.sh
          CIBW_BEFORE_ALL_MACOS: |
            ci-scripts/cibw-install-macos.sh && ci-scripts/cibw-build-deps.sh
          CIBW_BEFORE_BUILD: ci-scripts/cibw-build-cpp.sh
          CIBW_ENVIRONMENT_MACOS: >-
            CPATH="$(brew --prefix)/include"
            LIBRARY_PATH="$(brew --prefix)/lib"
            PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
            DYLD_LIBRARY_PATH="$(pwd)/install/lib:$DYLD_LIBRARY_PATH"
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/tests
      - name: Upload wheels to PyPI
        if: >-
          github.event_name == 'release'
          || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.deploy_target == 'PyPI')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: ci-scripts/upload-wheel.sh
      - name: Upload wheels to TestPyPI
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.deploy_target == 'Test PyPI'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
          TWINE_REPOSITORY: testpypi
        run: ci-scripts/upload-wheel.sh
