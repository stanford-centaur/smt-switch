on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
name: Lint
jobs:
  prek:
    runs-on: ubuntu-latest
    # Run tombi against pinned schemas rather than whatever schemastore serves
    # today, so a schema change cannot alter a result here on its own.
    # TOMBI_OFFLINE only takes true or false; anything else is an error.
    env:
      TOMBI_OFFLINE: "true"
      TOMBI_CACHE_HOME: ${{ github.workspace }}/.tombi-cache
    steps:
      - uses: actions/checkout@v7
      # prek is a drop-in replacement for pre-commit that reads the same
      # .pre-commit-config.yaml. It runs
      # `prek run --show-diff-on-failure --color=always --all-files` and caches
      # the hook environments between runs, both by default.
      #
      # Pin to an exact version: as of v3 this action no longer publishes
      # moving `v3`/`v3.0` tags.
      - uses: j178/prek-action@v3.0.0
